# Render Blueprint for Investor Index.
# In Render: New > Blueprint, point it at this repo. It creates one web service
# with a persistent disk so your data + photos survive deploys.
#
# After the first deploy: open a Shell on the web service and run
#   python seed.py
# once to load the Q2 2026 line-up (or just start adding competitors in /admin).
#
# PRICES: Yahoo Finance blocks datacenter IPs (Render, AWS, ...), so the server
# can't fetch closes itself — every symbol would come back empty. Instead run
# push_prices.py on your own machine (where Yahoo works) to fetch the closes and
# POST them to this service's /api/prices endpoint. See DEPLOY.md for the cron
# one-liner. That's why there is no Render cron job here.

services:
  - type: web
    name: investor-index
    runtime: python
    plan: starter            # persistent disks require a paid instance type
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: ADMIN_PASSWORD   # set this in the Render dashboard (kept secret)
        sync: false
      - key: INVESTOR_INDEX_DB
        value: /var/data/competition.db
      - key: INVESTOR_INDEX_PHOTOS
        value: /var/data/photos
      - key: PYTHON_VERSION   # also pinned by .python-version (pandas needs a wheel)
        value: "3.11.9"
    disk:
      name: investor-index-data
      mountPath: /var/data
      sizeGB: 1
